name: Build and publish image

# Builds the app's Docker image and pushes it to GitHub Container Registry
# (ghcr.io) on every push to main, so Athena's Unraid container template can
# just `docker pull` it like any other Community App - no local build step
# on Athena, no manual rebuild if the docker folder ever gets wiped again.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  # Hardcoded lowercase - github.repository preserves the repo's actual
  # case/punctuation (Media_Check), but Docker/GHCR tags must be lowercase,
  # so deriving it from github.repository breaks the build (same bug hit
  # on watch_sync/Watch_Sync earlier).
  IMAGE: ghcr.io/shiftylilbastrd/media-check

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
